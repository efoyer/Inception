services:
  mariadb:
    container_name: mariadb
    networks:
      - inception
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
    expose:
      - "3306"
  
  nginx:
    container_name: nginx
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - wordpress
      - redis
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "443:443"
    restart: on-failure
  
  wordpress:
    container_name: wordpress
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    env_file: .env
    restart: on-failure
    expose:
      - "9000"
  
  # BONUS

  redis:
    container_name: redis
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "6379:6379"
    restart: on-failure
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    env_file: .env
  
  ftp-server:
    container_name: ftp-server
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    restart: on-failure
    build: 
      context: requirements/bonus/ftp-server
      dockerfile: Dockerfile
    env_file: .env
  
  static_page:
    container_name: static_page
    networks:
      - inception
    ports:
      - "1080:80"
    restart: on-failure
    build:
      context: requirements/bonus/static_page
      dockerfile: Dockerfile
  
  adminer:
    container_name: adminer
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    networks:
      - inception
    restart: on-failure
    ports:
      - "8080:8080"
 
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/efoyer/data/wordpress'
  mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/efoyer/data/mariadb'

networks:
  inception:
    driver: bridge
