<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S K I B I D I  R I Z Z  Z O N E</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #ff00ff;
            animation: bg-seizure 2s infinite;
            font-family: "Comic Sans MS", "Impact", cursive;
            cursor: wait;
        }

        /* Animations zinzin */
        @keyframes bg-seizure {
            0% { background-color: #ff00ff; color: #00ff00; }
            25% { background-color: #00ffff; color: #ff0000; }
            50% { background-color: #ffff00; color: #0000ff; }
            75% { background-color: #00ff00; color: #ff00ff; }
            100% { background-color: #ff0000; color: #00ffff; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rev-spin {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes bounce-insane {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-300px) scale(1.5) rotate(45deg); }
        }

        @keyframes stretch-squish {
            0%, 100% { transform: scale(1, 1); }
            25% { transform: scale(3, 0.5) skewX(20deg); }
            75% { transform: scale(0.5, 3) skewY(-20deg); }
        }

        @keyframes flash-epilepsy {
            0% { opacity: 1; filter: invert(0%); }
            50% { opacity: 0; filter: invert(100%); }
            100% { opacity: 1; filter: invert(0%); }
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes marquee-crazy {
            0% { transform: translateX(100vw) rotate(10deg); }
            100% { transform: translateX(-100vw) rotate(-10deg); }
        }

        .spin { animation: spin 1s linear infinite; }
        .spin-slow { animation: spin 5s linear infinite; }
        .rev-spin { animation: rev-spin 0.5s linear infinite; }
        .bounce { animation: bounce-insane 0.8s infinite; }
        .stretch { animation: stretch-squish 2s infinite; }
        .flash { animation: flash-epilepsy 0.1s infinite; }
        .shake { animation: shake 0.2s infinite; }

        h1, h2, h3 {
            font-family: "Impact", sans-serif;
            text-transform: uppercase;
            text-shadow: 5px 5px 0px #000, -5px -5px 0px #fff;
            margin: 0;
            padding: 10px;
        }

        .absolute-chaos {
            position: absolute;
            z-index: 100;
        }

        .fixed-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.5;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        .grid-mess {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            padding: 50px;
        }

        marquee {
            font-size: 5rem;
            font-weight: bold;
            background: yellow;
            color: red;
            border: 10px dotted blue;
            margin: 20px 0;
        }
        
        .crazy-border {
            border: 15px dashed #00ff00;
            border-radius: 50% 20% / 10% 40%;
        }

        .jumpscare-zoom {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            z-index: 999999999;
            pointer-events: none; /* Pour ne pas bloquer les clics sur la page */
            animation: ultimateZoom 3s cubic-bezier(0.5, 0, 1, 0.5) forwards;
            box-shadow: 0 0 500px 100px red;
            border-radius: 20px;
        }

        @keyframes ultimateZoom {
            0% { transform: translate(-50%, -50%) scale(0.01) rotate(0deg); opacity: 0; filter: contrast(100%); }
            10% { opacity: 1; }
            90% { opacity: 1; filter: contrast(500%) saturate(1000%) hue-rotate(90deg); }
            100% { transform: translate(-50%, -50%) scale(30) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <img src="d3ad2d8d-9f5f-48c4-b7b5-bee54447d6abfile_2902385.webp" class="fixed-bg spin-slow" alt="Shrek bg">

    <marquee scrollamount="150" direction="right" class="shake">SKIBIDI RIZZ OHIO FINAL BOSS LEVEL 100 GYATT</marquee>
    <marquee scrollamount="50" direction="down" style="height: 200px; background: cyan; position: absolute; left: 10%; width: 200px; z-index: 999;">
        <h1 class="spin">QUOI LE CHIEN FAIT ???</h1>
    </marquee>

    <div style="text-align: center; margin-top: 50px;">
        <h1 class="stretch" style="font-size: 10vw;">SIGMA MALE GRINDSET</h1>
        <!-- <h2 class="bounce" style="color: pink; font-size: 5vw;">AMONG US SUS ඞඞඞ</h2> -->
    </div>

    <div class="grid-mess">
        <img src="1.jpg" class="spin crazy-border" style="width: 300px;" alt="Watermelon guy">
        <img src="2.png" class="shake" style="width: 400px; filter: hue-rotate(90deg);" alt="Arabic grinch">
        <img src="7.jpeg" class="stretch" style="width: 250px; border: 10px solid red;" alt="Minion moon">
        
        <img src="8.jpeg" class="rev-spin" style="width: 350px; border-radius: 50%;" alt="Roblox class">
        <div>
            <h1 class="flash" style="font-size: 4rem;">BING CHILLING 🍦</h1>
            <img src="9.jpeg" class="bounce" style="width: 300px;" alt="Triple T">
        </div>
        <img src="10.jpeg" class="shake crazy-border" style="width: 300px; transform: scaleX(-1);" alt="Prout clown">
    </div>

    <img src="3.jpg" class="absolute-chaos spin" style="top: 20%; right: 0%; width: 10vw;" alt="Laughing cat">
    
    <img src="4.png" class="absolute-chaos stretch" style="bottom: 10%; left: 5%; width: 10vw; z-index: 1000;" alt="Egg bird">
    
    <marquee scrollamount="200" direction="left" class="flash" style="position: fixed; bottom: 0; margin: 0; background: black; color: white;">
        L+RATIO+NO MAIDENS+TOUCH GRASS+BOZO
    </marquee>

    <img src="14.png" class="absolute-chaos bounce" style="top: 50%; left: 40%; width: 100px; filter: saturate(500%);" alt="Weird creature">

    <div style="position: fixed; top: 10px; right: 10px; background: rgba(255,0,255,0.8); padding: 20px; z-index: 9999; border: 5px solid lime;">
        <h3 class="spin">FANUM TAX</h3>
        <h3 class="rev-spin">MEWING STREAK 🤫🧏‍♂️</h3>
    </div>


    <script>
        const brainrotImages = [
            "1.jpg",
            "2.png",
            "3.ong",
            "4.png",
            "5.jpeg",
            "6.jpeg",
            "7.jpeg",
            "8.jpeg",
            "9.jpeg",
            "10.jpeg",
            "11.jpeg",
            "12.jpg",
            "13.jpg",
            "14.jpg",
            "15.jpg",
            "16.jpg",
            "17.jpg",
            "18.jpg",
            "19.jpg",
            "20.jpg",
            "21.jpg",
            "22.jpg"
        ];

        function triggerBrainrotJumpscare() {
            // Créer l'élément image
            const img = document.createElement('img');
            
            const randomIndex = Math.floor(Math.random() * brainrotImages.length);
            img.src = brainrotImages[randomIndex];
            
            img.className = 'jumpscare-zoom';
            
            document.body.appendChild(img);
            
            setTimeout(() => {
                if (document.body.contains(img)) {
                    document.body.removeChild(img);
                }
                scheduleNextJumpscare();
            }, 3000);
        }

        function scheduleNextJumpscare() {
            const nextDelay = 15000 + Math.random() * 30000;
            console.log(`Prochaine attaque dans ${Math.round(nextDelay/1000)} secondes...`);
            setTimeout(triggerBrainrotJumpscare, nextDelay);
        }

        setTimeout(triggerBrainrotJumpscare, 10000); 
    </script>
</body>
</html>
